<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="page_2.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon – Create Account</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="container">

        <h1 class="brand-title">A x o n</h1>
        <h2 class="subtitle">Create an account</h2>

        <p class="small-text">Enter your email to sign up</p>

        <form class="signup-form">

            <input type="email" placeholder="email@domain.com" class="input-email">

            <button class="btn-email">Sign up with email</button>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <button class="btn-google">
                <img src="Images/Google.jpg" alt="Google icon">
                Google
            </button>

            <div class="options">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>

                <a href="#" class="forgot">forgot Password?</a>
            </div>
        </form>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="socials">
            <a href="#">📘</a>
            <a href="#">📸</a>
            <a href="#">G</a>
        </div>

        <div class="footer-logo">
            <img src="Images/Logo.png" alt="Axon small logo">
        </div>

        <p class="footer-text">© 2025 Axon. All Rights Reserved.</p>
    </footer>
<script src="javascript.js"></script>
</body>
</html>
