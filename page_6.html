<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="page_6.css">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Listing - AXON</title>
  <link rel="stylesheet" href="product-listing.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=VT323&display=swap" rel="stylesheet" />
</head>

<body>
  <header class="header-green">
    <div class="logo">A X O N</div>
    <div class="search-container">
      <input type="text" placeholder="What do you need?" />
      <span class="icon-search">🔍</span>
      <span class="icon-cart">🛒</span>
    </div>
  </header>

  <nav class="main-nav">
    <a href="#">Home</a>
    <a href="#">About us</a>
    <a href="#">Contact</a>
    <a href="#">Products</a>
    <a href="#">Personal growth</a>
    <a href="#">Wishlist</a>
    <a href="#">Account</a>
  </nav>

  <section class="product-title">
    <h1>Products</h1>
  </section>

  <section class="product-grid">
    <!-- Example product card -->
    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Protein Powder</div>
      <div class="price">$199</div>
      <div class="stars">★★★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Creatine Powder</div>
      <div class="price">$249</div>
      <div class="stars">★★★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Whey Powder</div>
      <div class="price">$199</div>
      <div class="stars">★★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Mass Powder</div>
      <div class="price">$149</div>
      <div class="stars">★★★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Diet Guide</div>
      <div class="price">$299</div>
      <div class="stars">★★★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Dumbbells</div>
      <div class="price">$179</div>
      <div class="stars">★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Muscle Milk</div>
      <div class="price">$59</div>
      <div class="stars">★★★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Glutamine Caps</div>
      <div class="price">$99</div>
      <div class="stars">★★★★★</div>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/180" />
      <div class="name">Shilajit</div>
      <div class="price">$129</div>
      <div class="stars">★★★★</div>
    </div>
  </section>

  <footer class="footer-icons">
    <span>📘</span>
    <span>📸</span>
    <span>🌐</span>
    <span>🟢</span>
  </footer>
</body>
</html>
