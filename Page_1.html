<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="page_1.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>AXON</title>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="AXON Logo" class="logo" />
            <h1>AXON</h1>
        </div>
        <div class="search-cart">
            <input type="text" placeholder="What do you need?" />
            <button class="search-btn">🔍</button>
            <button class="cart-btn">🛒</button>
            <button class="profile-btn">👤</button>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Personal Growth</a></li>
            <li><a href="#">Wishlist</a></li>
            <li><a href="#">Account</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h2>Build <span>Your Body</span></h2>
        <h3>Transform Life</h3>
    </section>

    <section class="products">
        <div class="product-card">
            <img src="protein.png" alt="Protein Powder" />
            <h4>Protein Powder</h4>
            <p>$199</p>
            <div class="stars">★★★★★</div>
        </div>

        <div class="product-card">
            <img src="creatine.png" alt="Creatine Powder" />
            <h4>Creatine Powder</h4>
            <p>$249</p>
            <div class="stars">★★★★★</div>
        </div>

        <div class="product-card">
            <img src="whey.png" alt="Whey Powder" />
            <h4>Whey Powder</h4>
            <p>$199</p>
            <div class="stars">★★★★★</div>
        </div>
    </section>

    <section class="cta">
        <h3>Wanna Transform Your Body?</h3>
        <button class="contact-btn">Contact Us</button>
    </section>

    <footer>
        <p>© 2025 Axon. All Rights Reserved.</p>
        <div class="socials">🌐 📘 📸</div>
    </footer>
</body>
</html>
