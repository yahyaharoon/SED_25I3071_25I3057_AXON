<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AXON — Build Your Body</title>
  <!-- Link to your CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- TOP LOGO + GREEN BRAND BAR -->
  <header class="site-header">
    <div class="top-visual">
      <!-- Dark top area with logo graphic centered -->
      <div class="logo-wrap">
        <img src="logo.svg" alt="Axon logo" class="logo-graphic" />
      </div>
    </div>

    <div class="brand-bar">
      <div class="brand-inner">
        <div class="axon-title">AXON</div>

        <div class="search-cart">
          <label for="site-search" class="visually-hidden">Search</label>
          <input id="site-search" type="search" placeholder="What do you need?" />
          <button aria-label="Search" class="icon-btn search">🔍</button>
          <button aria-label="Cart" class="icon-btn cart">🛒</button>
          <button aria-label="Account" class="icon-btn account">👤</button>
        </div>
      </div>
    </div>

    <!-- NAVIGATION BLACK ROW -->
    <nav class="main-nav" aria-label="Main navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About us</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Personal growth</a></li>
        <li><a href="#">Wishlist</a></li>
        <li><a href="#">Account</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO — background image (centered muscular back silhouette) -->
  <section class="hero" role="region" aria-label="Hero">
    <!-- The background image should be applied via CSS to .hero (hero-bg.jpg) -->
    <div class="hero-inner">
      <h1 class="hero-title">Build <span class="pixel">Your Body</span></h1>
      <h2 class="hero-sub">Transform Life</h2>
    </div>
  </section>
