<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXON – Build Your Body</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- TOP AREA WITH LOGO -->
  <header class="top-header">
    <div class="top-logo-area">
      <img src="logo.png" class="main-logo" alt="Axon Logo">
    </div>

    <!-- GREEN BAR -->
    <div class="green-bar">
      <h1 class="brand-name">AXON</h1>

      <div class="search-box">
        <input type="search" placeholder="What do you need?">
        <button class="search-btn">🔍</button>
        <button class="cart-btn">🛒</button>
        <button class="profile-btn">👤</button>
      </div>
    </div>

    <!-- BLACK NAV BAR -->
    <nav class="main-nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About us</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Personal Growth</a></li>
        <li><a href="#">Wishlist</a></li>
        <li><a href="#">Account</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h2 class="hero-title">
      Build <span>Your Body</span>
    </h2>
    <h3 class="hero-sub">Transform Life</h3>
  </section>

  <!-- PRODUCT SECTION -->
  <section class="product-section">
    <div class="product-card">
      <div class="image-frame">
        <img src="protein.png" alt="Protein Powder">
      </div>
      <h4>Protein Powder</h4>
      <p class="price">$ 199</p>
      <div class="stars">★★★★★</div>
    </div>

    <div class="product-card">
      <div class="image-frame">
        <img src="creatine.png" alt="Creatine Powder">
      </div>
      <h4>Creatine Powder</h4>
      <p class="price">$ 249</p>
      <div class="stars">★★★★★</div>
    </div>

    <div class="product-card">
      <div class="image-frame">
        <img src="whey.png" alt="Whey Powder">
      </div>
      <h4>Whey Powder</h4>
      <p class="price">$ 199</p>
      <div class="stars">★★★★★</div>
    </div>
  </section>

  <!-- CTA SECTION -->
  <section class="cta-section">
    <h3>Wanna Transform Your Body?</h3>
    <button class="cta-btn">Contact us</button>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-socials">
      <a href="#">📘</a>
      <a href="#">📷</a>
      <a href="#">G</a>
    </div>
    <p>© 2025 Axon. All Rights Reserved.</p>
  </footer>

</body>
</html>
